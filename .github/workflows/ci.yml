name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CI: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Check coverage thresholds
        run: |
          npx vitest run --coverage --reporter=json 2>/dev/null | node -e "
            const d = [];
            process.stdin.on('data', c => d.push(c));
            process.stdin.on('end', () => {
              const json = JSON.parse(d.join(''));
              const totals = json?.total || {};
              // Current coverage: statements 64%, branches 52%, functions 67%, lines 66%
              // Thresholds set slightly below current to allow for variance
              const thresholds = { statements: 60, branches: 50, functions: 65, lines: 60 };
              const failed = [];
              for (const [key, min] of Object.entries(thresholds)) {
                const actual = totals[key]?.pct ?? 0;
                if (actual < min) failed.push(\`  \${key}: \${actual}% < \${min}%\`);
              }
              if (failed.length > 0) {
                console.error('❌ Coverage below threshold:');
                failed.forEach(f => console.error(f));
                process.exit(1);
              }
              console.log('✅ All coverage thresholds met');
            });
          "
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ls -la dist/

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: codeyang/codeyang:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
