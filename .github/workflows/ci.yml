name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Hard gate: any test failure fails the job. No retry bypass.
      # Windows runs the thread pool with capped workers to limit parallel
      # resource pressure. (Earlier flakiness was a test-isolation bug --
      # process.chdir racing between parallel workers -- fixed in the tests.)
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: npm test -- --pool=threads --maxWorkers=2
        env:
          CI: true
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: npm test
        env:
          CI: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # vitest.config.ts already declares hard thresholds; this step fails if below them.
      # Write JSON to a file (instead of piping stdout) because globalSetup logs
      # to stdout and would corrupt a pipe-parsed JSON document.
      - run: npx vitest run --coverage --reporter=json --outputFile=coverage-summary.json
      - name: Check coverage thresholds
        run: |
          node -e "
            const fs = require('fs');
            const json = JSON.parse(fs.readFileSync('coverage-summary.json', 'utf-8'));
            const totals = json?.total || {};
            // Thresholds enforced directly by vitest.config.ts; this job asserts
            // the summary is present and reports the actual numbers for visibility.
            const names = { statements: 'statements', branches: 'branches', functions: 'functions', lines: 'lines' };
            for (const [key, label] of Object.entries(names)) {
              const pct = totals[key]?.pct ?? -1;
              if (pct < 0) {
                console.error('❌ Coverage metric missing:', key);
                process.exit(1);
              }
              console.log('✅', label, pct + '%');
            }
          "
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ls -la dist/

  build-clients:
    name: Build Web client & VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Build React web client (vite)
        run: npm run web:build
      - name: Build web server bundle
        run: npm run build
      - name: Build VS Code extension (tsc)
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
          test -f out/extension.js

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: codeyang/codeyang:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
