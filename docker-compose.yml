version: '3.8'

services:
  codeyang:
    build: .
    image: codeyang:latest
    container_name: codeyang
    environment:
      # LLM Configuration
      - CODEYANG_PROVIDER=${CODEYANG_PROVIDER:-deepseek}
      - CODEYANG_API_KEY=${CODEYANG_API_KEY}
      - CODEYANG_MODEL=${CODEYANG_MODEL:-deepseek-reasoner}
      - CODEYANG_MAX_TOKENS=${CODEYANG_MAX_TOKENS:-8192}
      - CODEYANG_TEMPERATURE=${CODEYANG_TEMPERATURE:-0.7}

      # Optional: Base URL override
      - CODEYANG_BASE_URL=${CODEYANG_BASE_URL:-}

      # Optional: Debug mode
      - CODEYANG_DEBUG=${CODEYANG_DEBUG:-false}

      # Node environment
      - NODE_ENV=production

    volumes:
      # Mount your project workspace
      - ./workspace:/workspace

      # Mount config directory
      - codeyang-config:/root/.codeyang

      # Optional: Mount git credentials
      # - ~/.gitconfig:/root/.gitconfig:ro
      # - ~/.ssh:/root/.ssh:ro

    # Web UI port (if enabled)
    ports:
      - "3000:3000"

    # Interactive mode
    stdin_open: true
    tty: true

    # Restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

volumes:
  codeyang-config:
    driver: local
